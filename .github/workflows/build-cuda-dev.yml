name: Build cuda-dev base image

on:
  push:
    branches: [master, main]
    paths:
      - containers/cuda-dev/Dockerfile
      - dot_config/**
      - dot_bashrc.tmpl
      - dot_gitconfig.tmpl
  workflow_dispatch:
    inputs:
      cuda_version:
        description: CUDA version to build against
        default: "12.8.0"
        required: false

jobs:
  build:
    name: Build and push ghcr.io/jesserobertson/cuda-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve CUDA version
        id: vars
        run: |
          CUDA=${{ github.event.inputs.cuda_version || '12.8.0' }}
          echo "cuda_version=$CUDA" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/jesserobertson/cuda-dev" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: containers/cuda-dev
          push: true
          build-args: CUDA_VERSION=${{ steps.vars.outputs.cuda_version }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:cuda${{ steps.vars.outputs.cuda_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
