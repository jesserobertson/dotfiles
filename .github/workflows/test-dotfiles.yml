name: Test Dotfiles Installation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  test-ubuntu:
    name: Test on Ubuntu (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu test image
        working-directory: tests/docker/ubuntu
        run: docker build -t dotfiles-test-ubuntu .

      - name: Run Ubuntu bootstrap test
        run: |
          docker run --name test-container dotfiles-test-ubuntu

      - name: Copy verification script into container
        if: always()
        run: |
          docker cp tests/verify-installation.sh test-container:/home/testuser/verify.sh || true

      - name: Run verification in container
        if: always()
        run: |
          docker start test-container || true
          docker exec test-container bash -c "chmod +x /home/testuser/verify.sh && /home/testuser/verify.sh" || true

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs test-container || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-container || true

  test-macos:
    name: Test on macOS (Native)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check initial environment
        run: |
          echo "=== System Information ==="
          uname -a
          echo ""
          echo "=== Homebrew Status ==="
          which brew || echo "Homebrew not installed"
          echo ""
          echo "=== Chezmoi Status ==="
          which chezmoi || echo "Chezmoi not installed"

      - name: Install chezmoi
        run: |
          if ! command -v chezmoi &> /dev/null; then
            echo "Installing chezmoi..."
            sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" v2.66.0
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "Chezmoi already installed"
          fi

      - name: Initialize dotfiles with chezmoi
        env:
          CI: true
        run: |
          # Initialize chezmoi with the current checkout
          # The --apply flag will run chezmoi apply after init
          chezmoi init --source="$GITHUB_WORKSPACE" --apply

      - name: Run installation verification
        run: |
          chmod +x tests/verify-installation.sh
          tests/verify-installation.sh

      - name: Check installed packages
        if: always()
        run: |
          echo "=== Homebrew Formulae ==="
          brew list --formula || true
          echo ""
          echo "=== Homebrew Casks ==="
          brew list --cask || true
          echo ""
          echo "=== Chezmoi Status ==="
          chezmoi status || true

  test-docker-compose:
    name: Test with Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run all Docker Compose tests
        working-directory: tests
        run: |
          echo "=== Running Ubuntu test ==="
          docker compose run --rm ubuntu

          echo ""
          echo "=== Running Ubuntu offline test ==="
          docker compose run --rm ubuntu-offline

          echo ""
          echo "=== Running macOS simulation test ==="
          docker compose run --rm macos-sim

      - name: Cleanup Docker Compose
        if: always()
        working-directory: tests
        run: |
          docker compose down -v || true
