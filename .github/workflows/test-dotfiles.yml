name: Test Dotfiles Installation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  test-ubuntu:
    name: Test on Ubuntu (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Ubuntu test image
        working-directory: tests/docker/ubuntu
        run: docker build -t dotfiles-test-ubuntu .

      - name: Run Ubuntu bootstrap and bats tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/dotfiles-source:ro" \
            -e CI=true \
            dotfiles-test-ubuntu \
            bash -c '
              /home/testuser/test-bootstrap.sh &&
              for bp in /home/linuxbrew/.linuxbrew/bin/brew /opt/homebrew/bin/brew /usr/local/bin/brew; do
                [ -x "$bp" ] && eval "$($bp shellenv)" && break; done &&
              echo "" &&
              echo "=== Running bats tests ===" &&
              bats /dotfiles-source/tests/bats/install.bats \
                   /dotfiles-source/tests/bats/shell-env.bats \
                   /dotfiles-source/tests/bats/fish.bats
            '

  test-macos:
    name: Test on macOS (Native)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check initial environment
        run: |
          echo "=== System Information ==="
          uname -a
          echo ""
          echo "=== Homebrew Status ==="
          which brew || echo "Homebrew not installed"
          echo ""
          echo "=== Chezmoi Status ==="
          which chezmoi || echo "Chezmoi not installed"

      - name: Install chezmoi
        run: |
          if ! command -v chezmoi &> /dev/null; then
            echo "Installing chezmoi v2.66.0..."
            mkdir -p "$HOME/.local/bin"
            cd /tmp
            curl -sL "https://github.com/twpayne/chezmoi/releases/download/v2.66.0/chezmoi_2.66.0_darwin_arm64.tar.gz" -o chezmoi.tar.gz
            tar -xzf chezmoi.tar.gz
            mv chezmoi "$HOME/.local/bin/"
            chmod +x "$HOME/.local/bin/chezmoi"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "Chezmoi already installed"
          fi

      - name: Initialize dotfiles with chezmoi
        env:
          CI: true
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --apply

      - name: Install core packages for verification
        run: |
          brew install fish jq tmux starship fzf ripgrep zoxide bat git-delta

      - name: Run installation verification
        run: |
          chmod +x tests/verify-installation.sh
          tests/verify-installation.sh

      - name: Check installed packages
        if: always()
        run: |
          echo "=== Homebrew Formulae ==="
          brew list --formula || true
          echo ""
          echo "=== Homebrew Casks ==="
          brew list --cask || true
          echo ""
          echo "=== Chezmoi Status ==="
          chezmoi status || true

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\.git' } | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Host "FAIL: $($_.Name)"
              $parseErrors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "OK:   $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate wingetfile and scoopfile parse correctly
        shell: pwsh
        run: |
          $winget = Get-Content packages/wingetfile | Where-Object { $_ -notmatch '^\s*#' -and $_ -match '\S' }
          Write-Host "wingetfile: $($winget.Count) packages"
          if ($winget.Count -eq 0) { Write-Error "No packages in wingetfile"; exit 1 }

          $scoop = Get-Content packages/scoopfile | Where-Object { $_ -notmatch '^\s*#' -and $_ -match '\S' }
          Write-Host "scoopfile: $($scoop.Count) packages"
          if ($scoop.Count -eq 0) { Write-Error "No packages in scoopfile"; exit 1 }

      - name: Install chezmoi
        shell: pwsh
        run: |
          winget install twpayne.chezmoi --silent --accept-package-agreements --accept-source-agreements
          # winget installs to WinGet Links dir; add it to PATH for subsequent steps
          $wingetLinks = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links"
          echo "$wingetLinks" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Chezmoi dry-run on Windows
        shell: pwsh
        env:
          CI: "true"
        run: |
          chezmoi init --source="$env:GITHUB_WORKSPACE" --apply --dry-run

  test-docker-compose:
    name: Test with Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run all Docker Compose tests
        working-directory: tests
        run: |
          echo "=== Running Ubuntu test ==="
          docker compose run --rm ubuntu

          echo ""
          echo "=== Running Ubuntu offline test ==="
          docker compose run --rm ubuntu-offline

          echo ""
          echo "=== Running macOS simulation test ==="
          docker compose run --rm macos-sim

      - name: Cleanup Docker Compose
        if: always()
        working-directory: tests
        run: |
          docker compose down -v || true
