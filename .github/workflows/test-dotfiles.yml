name: Test Dotfiles Installation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allow manual triggering

jobs:
  test-ubuntu:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/local/lib/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git /usr/local/lib/bats-assert

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          BINDIR="$HOME/.local/bin" sh -c "$(curl -fsLS get.chezmoi.io)"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate templates
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE"
          chezmoi execute-template < dot_bashrc.tmpl > /dev/null
          chezmoi execute-template < dot_zshrc.tmpl > /dev/null
          chezmoi execute-template < dot_config/fish/env.fish.tmpl > /dev/null
          chezmoi execute-template < packages/brewfile.tmpl > /dev/null
          echo "All templates OK"

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: /home/linuxbrew/.linuxbrew
          key: linuxbrew-${{ hashFiles('packages/brewfile.tmpl') }}
          restore-keys: linuxbrew-

      - name: Run bootstrap
        env:
          CI: true
          HOMEBREW_SKIP_HEAVY: true
          DOTFILES_SOURCE: ${{ github.workspace }}
        run: bash tests/docker/ubuntu/test-bootstrap.sh

      - name: Run bats tests
        run: |
          for bp in /home/linuxbrew/.linuxbrew/bin/brew /opt/homebrew/bin/brew /usr/local/bin/brew; do
            [ -x "$bp" ] && eval "$($bp shellenv)" && break; done
          bats tests/bats/install.bats tests/bats/shell-env.bats tests/bats/fish.bats

  test-macos:
    name: Test on macOS (Native)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check initial environment
        run: |
          echo "=== System Information ==="
          uname -a
          echo ""
          echo "=== Homebrew Status ==="
          which brew || echo "Homebrew not installed"
          echo ""
          echo "=== Chezmoi Status ==="
          which chezmoi || echo "Chezmoi not installed"

      - name: Install chezmoi
        run: |
          if ! command -v chezmoi &> /dev/null; then
            mkdir -p "$HOME/.local/bin"
            BINDIR="$HOME/.local/bin" sh -c "$(curl -fsLS get.chezmoi.io)"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "Chezmoi already installed"
          fi

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-homebrew-${{ hashFiles('packages/brewfile.tmpl') }}
          restore-keys: macos-homebrew-

      - name: Initialize dotfiles with chezmoi
        env:
          CI: true
          HOMEBREW_SKIP_HEAVY: true
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --apply

      - name: Install core packages for verification
        run: |
          brew install fish jq tmux starship fzf ripgrep zoxide bat git-delta

      - name: Run installation verification
        run: |
          chmod +x tests/verify-installation.sh
          tests/verify-installation.sh

      - name: Check installed packages
        if: always()
        run: |
          echo "=== Homebrew Formulae ==="
          brew list --formula || true
          echo ""
          echo "=== Homebrew Casks ==="
          brew list --cask || true
          echo ""
          echo "=== Chezmoi Status ==="
          chezmoi status || true

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\.git' } | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Host "FAIL: $($_.Name)"
              $parseErrors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "OK:   $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate wingetfile and scoopfile parse correctly
        shell: pwsh
        run: |
          $winget = Get-Content packages/wingetfile | Where-Object { $_ -notmatch '^\s*#' -and $_ -match '\S' }
          Write-Host "wingetfile: $($winget.Count) packages"
          if ($winget.Count -eq 0) { Write-Error "No packages in wingetfile"; exit 1 }

          $scoop = Get-Content packages/scoopfile | Where-Object { $_ -notmatch '^\s*#' -and $_ -match '\S' }
          Write-Host "scoopfile: $($scoop.Count) packages"
          if ($scoop.Count -eq 0) { Write-Error "No packages in scoopfile"; exit 1 }

      - name: Install chezmoi
        shell: pwsh
        run: |
          winget install twpayne.chezmoi --source winget --silent --accept-package-agreements --accept-source-agreements
          # winget installs to WinGet Links dir; add it to PATH for subsequent steps
          $wingetLinks = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links"
          echo "$wingetLinks" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Chezmoi dry-run on Windows
        shell: pwsh
        env:
          CI: "true"
        run: |
          chezmoi init --source="$env:GITHUB_WORKSPACE" --apply --dry-run

  # The jobs above are smoke tests: they validate templates/syntax and (on
  # Ubuntu/macOS) run a real bootstrap, but Windows only does a --dry-run and
  # macOS/Ubuntu skip heavy packages, so they can't catch every real-install
  # bug (e.g. scripts that only break when actually executed on Windows).
  # These jobs do a real, undiluted `chezmoi init --apply` on each platform,
  # gated to only run once the corresponding smoke test above has passed.
  full-install-ubuntu:
    name: Full Install on Ubuntu
    needs: test-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: /home/linuxbrew/.linuxbrew
          key: linuxbrew-full-${{ hashFiles('packages/brewfile.tmpl') }}
          restore-keys: linuxbrew-full-

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          BINDIR="$HOME/.local/bin" sh -c "$(curl -fsLS get.chezmoi.io)"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Full install (real chezmoi init --apply)
        env:
          DOTFILES_FULL_INSTALL: "1"
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --apply

      - name: Verify installation
        run: |
          for bp in /home/linuxbrew/.linuxbrew/bin/brew /opt/homebrew/bin/brew /usr/local/bin/brew; do
            [ -x "$bp" ] && eval "$($bp shellenv)" && break; done
          chmod +x tests/verify-installation.sh
          tests/verify-installation.sh

  full-install-macos:
    name: Full Install on macOS
    needs: test-macos
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-homebrew-full-${{ hashFiles('packages/brewfile.tmpl') }}
          restore-keys: macos-homebrew-full-

      - name: Install chezmoi
        run: |
          if ! command -v chezmoi &> /dev/null; then
            mkdir -p "$HOME/.local/bin"
            BINDIR="$HOME/.local/bin" sh -c "$(curl -fsLS get.chezmoi.io)"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Full install (real chezmoi init --apply)
        env:
          DOTFILES_FULL_INSTALL: "1"
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --apply

      - name: Verify installation
        run: |
          chmod +x tests/verify-installation.sh
          tests/verify-installation.sh

      - name: Check installed packages
        if: always()
        run: |
          echo "=== Homebrew Formulae ==="
          brew list --formula || true
          echo ""
          echo "=== Chezmoi Status ==="
          chezmoi status || true

  full-install-windows:
    name: Full Install on Windows
    needs: test-windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        shell: pwsh
        run: |
          winget install twpayne.chezmoi --source winget --silent --accept-package-agreements --accept-source-agreements
          $wingetLinks = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links"
          echo "$wingetLinks" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Full install (real chezmoi init --apply)
        shell: pwsh
        env:
          DOTFILES_FULL_INSTALL: "1"
        run: |
          chezmoi init --source="$env:GITHUB_WORKSPACE" --apply

          # scoop shims aren't persisted to $GITHUB_PATH by the run_ script
          # (it only updates its own process's PATH), so add them here for
          # the verification step below.
          $scoopShims = Join-Path $HOME ".local" "scoop" "shims"
          echo "$scoopShims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify installation
        shell: pwsh
        run: |
          $status = chezmoi status --source="$env:GITHUB_WORKSPACE"
          if ($status) {
            Write-Host "chezmoi status is not clean:"
            Write-Host $status
            exit 1
          }

          $tools = @('starship', 'zoxide', 'fzf', 'rg', 'fd', 'bat', 'delta', 'yq', 'hx', 'gh', 'aws')
          $missing = @()
          foreach ($tool in $tools) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              $missing += $tool
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing expected tools: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All expected tools found on PATH"

