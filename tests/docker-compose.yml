services:
  # Ubuntu test environment
  ubuntu:
    build:
      context: ./docker/ubuntu
      dockerfile: Dockerfile
    image: dotfiles-test-ubuntu
    container_name: dotfiles-test-ubuntu
    environment:
      - TEST_ENV=docker
      - CI=true
    volumes:
      - ..:/dotfiles-source:ro
    command: >
      bash -c "
        /home/testuser/test-bootstrap.sh &&
        for bp in /home/linuxbrew/.linuxbrew/bin/brew /opt/homebrew/bin/brew /usr/local/bin/brew; do
          [ -x \"\$bp\" ] && eval \"\$(\$bp shellenv)\" && break; done &&
        echo '' &&
        echo '=== Running bats tests ===' &&
        bats /dotfiles-source/tests/bats/install.bats
             /dotfiles-source/tests/bats/shell-env.bats
             /dotfiles-source/tests/bats/fish.bats
      "

  # Ubuntu offline test (simulates no internet connection)
  ubuntu-offline:
    build:
      context: ./docker/ubuntu
      dockerfile: Dockerfile
    image: dotfiles-test-ubuntu
    container_name: dotfiles-test-ubuntu-offline
    environment:
      - TEST_ENV=docker
      - CI=true
      - OFFLINE_MODE=true
    network_mode: none
    command: /home/testuser/test-bootstrap-offline.sh

  # MacOS-like test environment (Linux with Homebrew paths)
  # Note: True macOS containers aren't possible with Docker
  # This tests Homebrew path detection and cross-platform logic
  macos-sim:
    build:
      context: ./docker/macos
      dockerfile: Dockerfile
    image: dotfiles-test-macos
    container_name: dotfiles-test-macos
    environment:
      - TEST_ENV=docker
      - CI=true
      - SIMULATE_MACOS=true
    volumes:
      - ..:/dotfiles-source:ro
    command: >
      bash -c "
        /home/testuser/test-bootstrap-macos.sh &&
        for bp in /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew /usr/local/bin/brew; do
          [ -x \"\$bp\" ] && eval \"\$(\$bp shellenv)\" && break; done &&
        echo '' &&
        echo '=== Running bats tests ===' &&
        bats /dotfiles-source/tests/bats/install.bats
      "
