services:
  # Ubuntu test environment
  ubuntu:
    build:
      context: ./docker/ubuntu
      dockerfile: Dockerfile
    image: dotfiles-test-ubuntu
    container_name: dotfiles-test-ubuntu
    environment:
      - TEST_ENV=docker
    volumes:
      # Mount the parent directory (dotfiles repo) for testing
      - ../..:/dotfiles-source:ro
    # Override CMD to run full verification
    command: >
      bash -c "
        echo '=== Starting Ubuntu Dotfiles Test ===' &&
        echo 'Running bootstrap test...' &&
        /home/testuser/test-bootstrap.sh &&
        echo '' &&
        echo '=== Running Installation Verification ===' &&
        if [ -f /dotfiles-source/tests/verify-installation.sh ]; then
          bash /dotfiles-source/tests/verify-installation.sh
        else
          echo 'Verification script not found, skipping...'
        fi
      "

  # Ubuntu offline test (simulates no internet connection)
  ubuntu-offline:
    build:
      context: ./docker/ubuntu
      dockerfile: Dockerfile
    image: dotfiles-test-ubuntu
    container_name: dotfiles-test-ubuntu-offline
    environment:
      - TEST_ENV=docker
      - OFFLINE_MODE=true
    network_mode: none
    command: /home/testuser/test-bootstrap-offline.sh

  # MacOS-like test environment (Linux with Homebrew paths)
  # Note: True macOS containers aren't possible with Docker
  # This tests Homebrew path detection and cross-platform logic
  macos-sim:
    build:
      context: ./docker/macos
      dockerfile: Dockerfile
    image: dotfiles-test-macos
    container_name: dotfiles-test-macos
    environment:
      - TEST_ENV=docker
      - SIMULATE_MACOS=true
    volumes:
      - ../..:/dotfiles-source:ro
    command: >
      bash -c "
        echo '=== Starting macOS Simulation Test ===' &&
        echo 'Running macOS bootstrap test...' &&
        /home/testuser/test-bootstrap-macos.sh &&
        echo '' &&
        echo '=== Running Installation Verification ===' &&
        if [ -f /dotfiles-source/tests/verify-installation.sh ]; then
          bash /dotfiles-source/tests/verify-installation.sh
        else
          echo 'Verification script not found, skipping...'
        fi
      "
