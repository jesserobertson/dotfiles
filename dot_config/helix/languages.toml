# Helix merges this with its built-in languages.toml.
# Keep this file to behavioural overrides rather than copying all defaults.

# ---------------------------------------------------------------------------
# Rust
# ---------------------------------------------------------------------------

[language-server.rust-analyzer.config]
cargo.features = "all"
check.command = "clippy"
check.features = "all"

[language-server.rust-analyzer.config.inlayHints]
bindingModeHints.enable = false
closingBraceHints.minLines = 20
closureReturnTypeHints.enable = "with_block"
discriminantHints.enable = "fieldless"
expressionAdjustmentHints.enable = "reborrow"
lifetimeElisionHints.enable = "skip_trivial"
typeHints.hideClosureInitialization = false

[[language]]
name = "rust"
auto-format = true
language-servers = ["rust-analyzer"]

# ---------------------------------------------------------------------------
# C and C++
# ---------------------------------------------------------------------------

[language-server.clangd]
command = "clangd"
args = [
  "--background-index",
  "--clang-tidy",
  "--completion-style=detailed",
  "--header-insertion=iwyu",
  "--function-arg-placeholders",
  "--fallback-style=llvm",
]

[[language]]
name = "c"
auto-format = true
formatter = { command = "clang-format" }
language-servers = ["clangd"]

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format" }
language-servers = ["clangd"]

# ---------------------------------------------------------------------------
# Python
#
# basedpyright supplies completion/navigation.
# Ruff owns linting, import sorting and formatting.
# Mypy remains your project/CI type checker, avoiding duplicate live errors.
# ---------------------------------------------------------------------------

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "off"
diagnosticMode = "openFilesOnly"
autoImportCompletions = true
autoSearchPaths = true
useLibraryCodeForTypes = true

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings]
logLevel = "warning"

[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true

# ---------------------------------------------------------------------------
# Bash
# ---------------------------------------------------------------------------

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
auto-format = false

# ---------------------------------------------------------------------------
# Fish
# ---------------------------------------------------------------------------

[language-server.fish-lsp]
command = "fish-lsp"
args = ["start"]

[[language]]
name = "fish"
language-servers = ["fish-lsp"]
auto-format = false

# ---------------------------------------------------------------------------
# PowerShell
#
# This assumes an executable wrapper named powershell-editor-services is on
# PATH. Wrapper examples are below because the Editor Services entry point
# has an installation-dependent absolute path.
# ---------------------------------------------------------------------------

[language-server.powershell-editor-services]
command = "powershell-editor-services"

[[language]]
name = "powershell"
language-servers = ["powershell-editor-services"]
auto-format = false
