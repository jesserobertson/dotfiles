command_timeout = 500
scan_timeout = 30

# Disabled: renders on every prompt (not just in-project) once PIXI_ENVIRONMENT_NAME
# is set by an activated shell, shelling out to `pixi --version` each time. Flaky
# when the active project lives under OneDrive Files-On-Demand (cloud placeholder
# reads can stall/fail) — see ~/Developer move for the same class of issue.
[pixi]
disabled = true


# Slow modules that shell out or query the OS on every prompt (~30-50ms each).
[docker_context]
disabled = true

[battery]
disabled = true

[username]
disabled = true

[package]
disabled = true

[git_status]
ignore_submodules = true