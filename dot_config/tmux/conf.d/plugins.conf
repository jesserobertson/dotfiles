# list of plugins to install via tpm
# e.g.: set -g @plugin 'MunifTanjim/tmux-suspend'

# dracula theme with powerline support
set -g @plugin 'dracula/tmux'

# dracula configuration - nord-inspired with gaps
set -g @dracula-show-powerline true
set -g @dracula-plugins "battery time"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-refresh-rate 5

# powerline separators with gaps (nord-style)
set -g @dracula-show-left-sep ''
set -g @dracula-show-right-sep ''
set -g @dracula-left-icon-padding 1

# customize colors for simpler palette (purple/pink only)
set -g @dracula-battery-colors "pink dark_purple"
set -g @dracula-time-colors "dark_purple white"
